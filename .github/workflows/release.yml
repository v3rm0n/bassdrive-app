name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Builds every platform without releasing, to check a branch before tagging.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Mise
        uses: jdx/mise-action@v2

      - name: Get Flutter version from Mise
        id: flutter-version
        run: |
          FLUTTER_VERSION=$(mise list flutter --json | jq -r '.[0].version')
          echo "version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android (APK + AAB)
    needs: analyze-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Mise
        uses: jdx/mise-action@v2

      - name: Get Flutter version from Mise
        id: flutter-version
        run: |
          FLUTTER_VERSION=$(mise list flutter --json | jq -r '.[0].version')
          echo "version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=../upload-keystore.jks
          EOF
            echo "Android release keystore configured."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; falling back to debug signing."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK and Play Store AAB
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  build-macos:
    name: Build macOS App
    needs: analyze-and-test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Mise
        uses: jdx/mise-action@v2

      - name: Get Flutter version from Mise
        id: flutter-version
        run: |
          FLUTTER_VERSION=$(mise list flutter --json | jq -r '.[0].version')
          echo "version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Sign macOS app bundle (if Developer ID certificate is configured)
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "::warning::MACOS_CERTIFICATE_P12 secret not set; skipping Developer ID signing."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          IDENTITY="${MACOS_SIGNING_IDENTITY:-Developer ID Application}"
          codesign --deep --force --verify --verbose \
            --options runtime \
            --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$IDENTITY" \
            "build/macos/Build/Products/Release/Bassdrive Radio.app"

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Bassdrive Radio" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "Bassdrive-Radio-macOS.dmg" \
            "build/macos/Build/Products/Release/Bassdrive Radio.app"

      - name: Notarize and staple DMG (if Apple credentials are configured)
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::Apple notarization secrets not fully set; skipping DMG notarization."
            exit 0
          fi

          IDENTITY="${MACOS_SIGNING_IDENTITY:-Developer ID Application}"
          codesign --force --timestamp --sign "$IDENTITY" "Bassdrive-Radio-macOS.dmg"
          xcrun notarytool submit "Bassdrive-Radio-macOS.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "Bassdrive-Radio-macOS.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: Bassdrive-Radio-macOS.dmg

  build-ios:
    name: Build iOS (and Upload to TestFlight)
    needs: analyze-and-test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Mise
        uses: jdx/mise-action@v2

      - name: Get Flutter version from Mise
        id: flutter-version
        run: |
          FLUTTER_VERSION=$(mise list flutter --json | jq -r '.[0].version')
          echo "version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify unsigned iOS release build (when signing secrets are not yet set)
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
        run: |
          if [ -z "$IOS_CERTIFICATE_P12" ]; then
            echo "::notice::IOS_CERTIFICATE_P12 not set; running unsigned iOS build check."
            flutter build ios --release --no-codesign
          fi

      - name: Build signed IPA and upload to TestFlight
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -z "$IOS_CERTIFICATE_P12" ]; then
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/ios_dist.p12"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$IOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$PROFILE_DIR/${PROFILE_UUID}.mobileprovision"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.maido.bassdrive</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

          if [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] && [ -n "$APP_STORE_CONNECT_API_KEY_P8" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            mkdir -p "$HOME/.private_keys"
            echo "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode > "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
            xcrun altool --upload-app --type ios \
              --file build/ios/ipa/*.ipa \
              --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          fi

  build-windows:
    name: Build Windows (Installer + MSIX + ZIP)
    needs: analyze-and-test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Mise
        uses: jdx/mise-action@v2

      - name: Get Flutter version from Mise
        id: flutter-version
        shell: pwsh
        run: |
          $FLUTTER_VERSION = (mise list flutter --json | ConvertFrom-Json)[0].version
          "version=$FLUTTER_VERSION" >> $env:GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create ZIP archive
        run: |
          mkdir -Force dist | Out-Null
          7z a -tzip dist\Bassdrive-Radio-Windows.zip .\build\windows\x64\runner\Release\*

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $versionLine = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$versionLine" packaging\windows\bassdrive_setup.iss

      - name: Build Windows MSIX package
        shell: pwsh
        env:
          WINDOWS_STORE_PUBLISHER: ${{ secrets.WINDOWS_STORE_PUBLISHER }}
          WINDOWS_STORE_IDENTITY_NAME: ${{ secrets.WINDOWS_STORE_IDENTITY_NAME }}
        run: |
          $versionMatch = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)').Matches[0]
          $msixVersion = "$($versionMatch.Groups[1].Value).$($versionMatch.Groups[2].Value)"
          $args = @(
            'run', 'msix:create',
            '--build-windows=false',
            '--output-path=dist',
            '--output-name=Bassdrive-Radio-Windows',
            "--version=$msixVersion"
          )
          if ($env:WINDOWS_STORE_PUBLISHER -and $env:WINDOWS_STORE_IDENTITY_NAME) {
            $args += '--store'
            $args += "--publisher=$env:WINDOWS_STORE_PUBLISHER"
            $args += "--identity-name=$env:WINDOWS_STORE_IDENTITY_NAME"
          } else {
            $args += '--sign-msix=false'
          }
          & dart @args

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/Bassdrive-Radio-Windows.zip
            dist/Bassdrive-Radio-Windows-Setup.exe
            dist/Bassdrive-Radio-Windows.msix

  build-linux:
    name: Build Linux (AppImage + DEB + tarball)
    needs: analyze-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv \
            dpkg-dev fuse libfuse2

      - name: Setup Mise
        uses: jdx/mise-action@v2

      - name: Get Flutter version from Mise
        id: flutter-version
        run: |
          FLUTTER_VERSION=$(mise list flutter --json | jq -r '.[0].version')
          echo "version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create tarball, DEB, and AppImage
        run: |
          mkdir -p dist
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          BUNDLE_DIR="build/linux/x64/release/bundle"

          tar -czf dist/Bassdrive-Radio-Linux.tar.gz -C "$BUNDLE_DIR" .

          ./packaging/linux/build-deb.sh "$VERSION" "$BUNDLE_DIR" dist/Bassdrive-Radio-Linux.deb

          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          APPIMAGETOOL=/tmp/appimagetool ./packaging/linux/build-appimage.sh \
            "$BUNDLE_DIR" dist/Bassdrive-Radio-Linux.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/Bassdrive-Radio-Linux.tar.gz
            dist/Bassdrive-Radio-Linux.deb
            dist/Bassdrive-Radio-Linux.AppImage

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-macos, build-ios, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: ./artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: ./artifacts/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: ./artifacts/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: ./artifacts/

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/app-release.apk
            ./artifacts/app-release.aab
            ./artifacts/Bassdrive-Radio-macOS.dmg
            ./artifacts/Bassdrive-Radio-Windows-Setup.exe
            ./artifacts/Bassdrive-Radio-Windows.msix
            ./artifacts/Bassdrive-Radio-Windows.zip
            ./artifacts/Bassdrive-Radio-Linux.AppImage
            ./artifacts/Bassdrive-Radio-Linux.deb
            ./artifacts/Bassdrive-Radio-Linux.tar.gz
            ./artifacts/SHA256SUMS.txt
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit update to Winget (if configured)
        if: env.WINGET_TOKEN != '' && env.WINGET_PACKAGE_ID != ''
        uses: vedantmgoyal9/winget-releaser@v2
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGET_PACKAGE_ID: ${{ vars.WINGET_PACKAGE_ID }}
        with:
          identifier: ${{ vars.WINGET_PACKAGE_ID }}
          installers-regex: 'Bassdrive-Radio-Windows-Setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
